lints.workspace = true

[package]
name = "gix-lfs"
version = "0.0.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing with handling git large file support"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[features]
## Build Git LFS Batch API download requests and verify streamed object contents.
download = ["dep:bstr", "dep:gix-glob", "dep:faster-hex", "dep:gix-error", "dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
bstr = { version = "1.12.0", default-features = false, features = ["std"], optional = true }
gix-glob = { version = "^0.29.1", path = "../gix-glob", optional = true }
gix-error = { version = "^0.5.2", path = "../gix-error", optional = true }
faster-hex = { version = "0.10.1", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0.114", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
