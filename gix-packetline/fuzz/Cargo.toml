[package]
name = "gix-packetline-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
bstr = "1.8.0"
libfuzzer-sys = "0.4"

[dependencies.gix-packetline]
path = ".."
features = ["blocking-io"]

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "packet_lines"
path = "fuzz_targets/packet_lines.rs"
test = false
doc = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

[[bin]]
name = "streaming"
path = "fuzz_targets/streaming.rs"
test = false
doc = false
