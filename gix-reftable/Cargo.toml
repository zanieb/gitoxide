lints.workspace = true

[package]
name = "gix-reftable"
version = "0.0.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project implementing the reftable binary format"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2021"
rust-version = "1.82"

[lib]
doctest = false

[features]
default = ["sha1"]
## Enable support for SHA-1 object ids in reftable records.
sha1 = ["gix-hash/sha1"]
## Enable support for SHA-256 object ids in reftable records.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-hash = { version = "^0.25.0", path = "../gix-hash" }
thiserror = "2.0.18"
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
crc32fast = "1.5.0"
flate2 = "1.0"

[[bench]]
name = "reftable"
harness = false
path = "./benches/reftable.rs"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.6.0"
tempfile = "3"
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
